spring.application.name=authentication-service
server.port=8082

spring.config.import=file:/home/salihbstg/Projects/hatirlabeni-app/backend/config/application.properties
spring.jpa.hibernate.ddl-auto=update

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${AUTH_DB_URL}

app.root.email=${ROOT_EMAIL}
app.root.password=${ROOT_PASSWORD}
app.root.username=${ROOT_USERNAME}

jwt.secret=${SECRET_KEY}
jwt.expiration=${EXPIRATION}
REFRESH_EXPIRATION=${REFRESH_EXPIRATION}

user-service.url=${user-service.url}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

FRONTEND_URL=http://localhost:5173
COOKIE_SECURE=${COOKIE_SECURE}

spring.main.banner-mode=off