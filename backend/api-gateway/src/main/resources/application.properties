spring.application.name=api-gateway
server.port=8080

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/users/**

# Authentication Service
spring.cloud.gateway.server.webmvc.routes[1].id=authentication-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/auth/**

# Address Service
spring.cloud.gateway.server.webmvc.routes[2].id=address-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/address/**

# OAuth2 Authorization - Authentication Service
spring.cloud.gateway.server.webmvc.routes[3].id=oauth2-authorization
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/oauth2/**

# OAuth2 Callback - Authentication Service
spring.cloud.gateway.server.webmvc.routes[4].id=oauth2-callback
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/login/oauth2/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true